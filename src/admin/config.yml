backend:
  name: github
  repo: Alberto35M/Alberto35M-Portfolio
  branch: main
  # La conexión OAuth se agregará en el siguiente paso.

media_folder: public/images
public_folder: /images

site_url: https://alberto35m.pages.dev
display_url: https://alberto35m.pages.dev
  # base_url: https://TU-SERVICIO-OAUTH.example
  # auth_endpoint: auth
media_folder: public/images
public_folder: /images
publish: true
site_url: https://YOUR_PROJECT.pages.dev
collections:
  - name: proyectos
    label: Projects
    label_singular: Project
    folder: content/proyectos
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview: false
    fields:
      - {label: Project name, name: title, widget: string}
      - {label: Category, name: category, widget: select, options: [Addon, Map, Tool]}
      - {label: Minecraft version, name: version, widget: string, default: "1.26+"}
      - {label: Short description (project cards), name: shortDescription, widget: text, hint: "One or two sentences shown directly below the project title."}
      - {label: General summary (project detail), name: summary, widget: text}
      - {label: Cover image, name: cover, widget: image, required: true}
      - {label: Published, name: published, widget: boolean, default: false}
      - {label: Display order, name: order, widget: number, default: 0, value_type: int}
      - {label: CurseForge link, name: curseforge, widget: string, required: false}
      - {label: YouTube trailer, name: trailer, widget: string, required: false}
      - label: Features
        name: features
        widget: list
        required: false
        field: {label: Feature, name: feature, widget: string}
      - label: Gallery
        name: gallery
        widget: list
        required: false
        field: {label: Image, name: image, widget: image}
      - {label: Full description, name: body, widget: markdown}
