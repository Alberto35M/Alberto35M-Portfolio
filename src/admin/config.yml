
backend:
  name: github
  repo: Alberto35M/Alberto35M-Portfolio
  branch: main
  base_url: https://alberto35m-auth.luis-1301-albert.workers.dev
  auth_endpoint: auth

media_folder: public/images
public_folder: /images

publish: true

site_url: https://alberto35m.pages.dev
display_url: https://alberto35m.pages.dev

collections:
  - name: proyectos
    label: Mis proyectos
    label_singular: Proyecto
    folder: content/proyectos
    create: true
    delete: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview: true

    fields:
      - label: Nombre del proyecto
        name: title
        widget: string

      - label: Categoría
        name: category
        widget: select
        options:
          - Addon
          - Map
          - Tool

      - label: Versión de Minecraft
        name: version
        widget: string
        default: "1.26+"

      - label: Descripción corta (tarjetas)
        name: shortDescription
        widget: text
        hint: Aparece debajo del título en la tarjeta. Una o dos frases.

      - label: Resumen de la página
        name: summary
        widget: text
        hint: Introducción que aparece junto a la portada en la página del proyecto.

      - label: Portada principal
        name: cover
        widget: image
        required: true

      - label: Mostrar en el portafolio
        name: published
        widget: boolean
        hint: Actívalo cuando quieras que aparezca en la web.
        default: false

      - label: Orden de aparición
        name: order
        widget: number
        hint: Un número más alto aparece antes.
        default: 0
        value_type: int

      - label: Enlace de descarga (cualquier plataforma)
        name: curseforge
        widget: string
        hint: Pega la dirección completa https://...
        required: false

      - label: Video del proyecto (URL)
        name: trailer
        widget: string
        hint: Opcional. Enlace completo del video.
        required: false

      - label: Tipo de video
        name: videoType
        widget: select
        options:
          - {label: "Tráiler — Watch Trailer", value: trailer}
          - {label: "Demostración — Watch Video", value: video}
          - {label: "Tutorial — Watch Tutorial", value: tutorial}
        default: trailer
        required: false

      - label: Características destacadas
        name: features
        widget: list
        collapsed: true
        summary: "{{fields.feature}}"
        required: false
        field:
          label: Característica
          name: feature
          widget: string

      - label: Galería de capturas
        name: gallery
        widget: list
        collapsed: true
        summary: "Captura"
        required: false
        fields:
          - {label: Imagen, name: image, widget: image}
          - {label: Título (opcional), name: title, widget: string, required: false}
          - {label: Descripción (opcional), name: description, widget: text, required: false}

      - label: Descripción completa
        name: body
        widget: markdown
